name: daily-paper-trade

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ccxt pandas numpy
      - run: python trader.py
      - name: Save portfolio and dashboard
        if: always()
        run: |
          git config user.name "paper-trader"
          git config user.email "paper-trader@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || (git commit -m "Daily paper-trade update" && git push)
